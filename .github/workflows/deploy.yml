name: Deploy .NET 8 App to Railway

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore "./APIonRailwaywithCICD/APIonRailwaywithCICD.csproj"

      - name: Build
        run: dotnet build "./APIonRailwaywithCICD/APIonRailwaywithCICD.csproj" --configuration Release --no-restore

      - name: Publish
        run: dotnet publish "./APIonRailwaywithCICD/APIonRailwaywithCICD.csproj" -c Release -o ./publish --self-contained true -r linux-x64 /p:PublishSingleFile=true /p:PublishTrimmed=false

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service APIonRailwaywithCICD ./publish
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
